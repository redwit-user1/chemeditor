<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KMEDIhub ELN 연구노트 — 구조를 그리거나 붙여넣으면 분자식·분자량이 자동 계산됩니다"
    />
    <title>KMEDIhub ELN · 연구노트</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%AC%A1%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Minimal Node-global shims. Some of Ketcher's bundled dependencies (and the
      emscripten Indigo glue) reference `global` / `process` at module scope.
      We provide just enough to satisfy them without pretending to be Node —
      `process.versions.node` is intentionally left undefined so the WASM engine
      keeps taking its browser code path.
    -->
    <script>
      window.global = window.global || window;
      window.process = window.process || { env: {}, versions: {} };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

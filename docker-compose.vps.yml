# VPS deploy: RDKit backend routed through Hostinger's built-in Traefik.
#
#   docker compose -f docker-compose.vps.yml up -d --build
#
# This VPS already runs Traefik (host network, Docker-label provider, Let's
# Encrypt HTTP-01 resolver named "letsencrypt"). We do NOT publish any host
# port and we do NOT run our own reverse proxy — Traefik discovers this
# backend by its labels and terminates TLS for us.
#
# The backend becomes reachable at:  https://chemeditor.srv1711580.hstgr.cloud
# (Hostinger provides wildcard DNS *.srv1711580.hstgr.cloud → this VPS.)
#
# The frontend lives on Vercel; frontend/vercel.json proxies /api to that host.
# Traefik reaches this container by its IP on chemeditor_default:8000, so no
# host port is exposed — RDKit is never published raw.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Leave unset to use the bundled fixture. Point at a mounted SDF (see
      # ./data volume) to index real / synthetic data instead.
      CHEM_INDEX_SDF: ${CHEM_INDEX_SDF:-}
      CHEM_SEARCH_BACKEND: ${CHEM_SEARCH_BACKEND:-portable_fp}
    volumes:
      - ./data:/app/data:ro
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chemeditor.entrypoints=websecure"
      - "traefik.http.routers.chemeditor.rule=Host(`chemeditor.srv1711580.hstgr.cloud`)"
      - "traefik.http.routers.chemeditor.tls.certresolver=letsencrypt"
      - "traefik.http.services.chemeditor.loadbalancer.server.port=8000"
